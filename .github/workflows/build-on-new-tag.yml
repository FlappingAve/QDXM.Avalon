name: Release QDXM Avalon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test "QDXM.Avalon.Tests\QDXM.Avalon.Tests.csproj" -c Release --results-directory "Testing\TestResults"

      - name: Publish framework-dependent build
        run: dotnet publish "QDXM.Avalon\QDXM.Avalon.csproj" -c Release -r win-x64 --self-contained false -o "artifacts\QDXM.Avalon-win-x64"

      - name: Publish self-contained build
        run: dotnet publish "QDXM.Avalon\QDXM.Avalon.csproj" -c Release -r win-x64 --self-contained true -o "artifacts\QDXM.Avalon-win-x64-With-Runtime"

      - name: Zip framework-dependent build
        shell: pwsh
        run: Compress-Archive -Path "artifacts\QDXM.Avalon-win-x64\*" -DestinationPath "artifacts\QDXM.Avalon-${{ github.ref_name }}.zip"

      - name: Zip self-contained build
        shell: pwsh
        run: Compress-Archive -Path "artifacts\QDXM.Avalon-win-x64-With-Runtime\*" -DestinationPath "artifacts\QDXM.Avalon-${{ github.ref_name }}-With-Runtime.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}"
          gh release create $version `
            "artifacts\QDXM.Avalon-$version.zip" `
            "artifacts\QDXM.Avalon-$version-With-Runtime.zip" `
            --title "QDXM Avalon $version" `
            --notes @"
          - ``QDXM.Avalon-$version-With-Runtime.zip``: recommended for most users. Includes the .NET runtime.
          - ``QDXM.Avalon-$version.zip``: smaller download. Requires the .NET 8 Desktop Runtime.
          "@
